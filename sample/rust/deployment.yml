apiVersion: apps/v1
kind: Deployment
metadata:
  name: create-hosts
  labels:
    k8s-app: create-hosts
spec:
  selector:
    matchLabels:
      name: create-hosts
  template:
    metadata:
      labels:
        name: create-hosts
    spec:
      # kubelet が生成した /etc/hosts を共有ボリュームへ退避しておく。
      # hosts-creator はこれを base_hosts として使い、Pod 自身のエントリを失わない。
      initContainers:
        - name: seed-hosts
          image: busybox:1.36
          command: ["sh", "-c", "cp /etc/hosts /hosts-shared/hosts && cat /hosts-shared/hosts"]
          volumeMounts:
            - name: hosts-shared
              mountPath: /hosts-shared
      containers:
        - name: nginx
          image: nginx:1.22
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8800
          volumeMounts:
            - name: hosts-shared
              mountPath: /etc/hosts
              subPath: hosts
        - name: create-hosts
          image: rhemsjapan/hosts-creator:rust-latest
          volumeMounts:
            - name: hosts-shared
              mountPath: /etc/hosts
              subPath: hosts
            - name: dummy-hosts-list
              mountPath: /etc/create_hosts/hosts_list
              subPath: hosts_list
            - name: setting-ini
              mountPath: /etc/create_hosts/setting.ini
              subPath: setting.ini
          env:
            #- name: AWS_ACCESS_KEY_ID
            #  value: your_aws_id
            #- name: AWS_SECRET_ACCESS_KEY
            #  value: your_aws_key
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-1
      volumes:
        - name: hosts-shared
          emptyDir: {}
        - name: dummy-hosts-list
          configMap:
            name: dummy-hosts-list
        - name: setting-ini
          configMap:
            name: setting-ini
